name: Deploy test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx vue-tsc -b

      - name: Build
        env:
          BASE_PATH: /shtori-i-dekor-portfolio/
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee build.log

      - name: Annotate build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            tail -n 40 build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy test
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
